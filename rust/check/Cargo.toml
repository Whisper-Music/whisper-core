# Проверка общей части Whisper Archive (rust/whisper/) без приложения: cargo test --manifest-path rust/check/Cargo.toml
# Только в отдельной копии whisper-core, НЕ в src/core приложения: Tauri встроит в программу всю папку src,
# вместе с rust/check/target.
# Нужен Windows (как в CI) или Linux с библиотеками Tauri (libwebkit2gtk-4.1-dev и т. д.).
[package]
name = "whisper-core-check"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# те же библиотеки, что нужны Rust ядра в самом приложении (список — CLAUDE.md, «Rust»)
tauri = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
# ключ виджета OBS (rust/obs.rs) — случайные 128 бит
getrandom = "0.3"

# Unix: O_NOFOLLOW и проверка владельца при чтении obs.key (rust/obs.rs) и счётчиков входа (rust/whisper/auth.rs)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
