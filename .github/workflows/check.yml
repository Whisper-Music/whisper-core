# Проверка ядра без приложения: синтаксис JS, движок тем в Node, сборка и тесты общей части Whisper Archive (rust/check).
name: check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Синтаксис JavaScript
        run: for f in *.js; do node --check "$f"; done
      - name: Движок тем в Node (без браузера)
        run: |
          cat > /tmp/t.cjs <<'JS'
          const WMT = require(process.cwd() + "/wmt.js"), TC = require(process.cwd() + "/theme-css.js");
          (async () => {
            const th = await WMT.open(new TextEncoder().encode('#WMT 1\n@@ manifest\n{ "id": "t", "name": "T" }\n@@ css whisper-x\n.a { color: red; background: url(http://evil) }\n@import "x";\n[data-w="nope"] { b: c }\n'));
            const css = TC.scopeCss(th.css("whisper-x"), "t");
            if (css !== ':root[data-style="t"] .a { color: red }') { console.error(JSON.stringify(css)); process.exit(1); }
            console.log("ok:", css);
          })();
          JS
          node /tmp/t.cjs

  rust:
    runs-on: windows-latest          # Tauri на Windows собирается без системных библиотек
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: rust/check }
      - run: cargo test --lib
        working-directory: rust/check
